<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>KelvinCast — Professional Weather in Kelvin</title>
  <meta name="description" content="The world's most precise weather dashboard. All temperatures in Kelvin. Zero ambiguity. Absolute scale.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌡️%3C/text%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0a0a0f;
      color: #e8e8ec;
      line-height: 1.5;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    @media (min-width: 768px) { .container { padding: 40px 24px; } }

    /* Design system tokens fallback */
    :root {
      --kimi-color-text-primary: #e8e8ec;
      --kimi-color-text-secondary: #a0a0a8;
      --kimi-color-text-tertiary: #6e6e78;
      --kimi-color-text-quaternary: #4a4a52;
      --kimi-color-surface: #12121a;
      --kimi-color-surface-muted: #1a1a24;
      --kimi-color-surface-raised: #1e1e2a;
      --kimi-color-surface-strong: #2a2a38;
      --kimi-color-border: #2a2a38;
      --kimi-color-danger: #ef4444;
      --kimi-color-positive: #22c55e;
      --kimi-color-warning: #f59e0b;
      --kimi-color-accent: #3b82f6;
      --kimi-chart-1: #3b82f6;
      --kimi-chart-2: #ef4444;
      --kimi-chart-3: #22c55e;
      --kimi-chart-4: #a855f7;
      --kimi-chart-5: #6e6e78;
      --kimi-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --kimi-font-mono: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, monospace;
      --t-micro: 60ms;
      --t-fast: 120ms;
      --t-normal: 200ms;
      --t-slow: 300ms;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in: cubic-bezier(0.7, 0, 0.84, 0);
      --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Widget styles */
    .kw-root { font-family: var(--kimi-font-sans); color: var(--kimi-color-text-primary); }
    .kw-root * { box-sizing: border-box; }
    .kw-root button, .kw-root input { font: inherit; }
    .kw-root svg { display: block; }

    .kw-hero { display: flex; flex-direction: column; gap: 24px; padding: 24px; border-radius: 12px; border: 1px solid var(--kimi-color-border); background: var(--kimi-color-surface); }
    .kw-searchbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--kimi-color-border); background: var(--kimi-color-surface-muted); }
    .kw-searchbar input { flex: 1; border: none; outline: none; background: transparent; color: var(--kimi-color-text-primary); font-size: 16px; }
    .kw-searchbar input::placeholder { color: var(--kimi-color-text-quaternary); }
    .kw-searchbar button { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; border: none; background: var(--kimi-color-surface-raised); cursor: pointer; color: var(--kimi-color-text-secondary); transition: background var(--t-fast) var(--ease-out); }
    .kw-searchbar button:hover { background: var(--kimi-color-surface-strong); }

    .kw-main { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 720px) { .kw-main { grid-template-columns: 1fr; } }

    .kw-current { display: flex; flex-direction: column; gap: 16px; }
    .kw-city { font-size: 28px; font-weight: 500; line-height: 1.1; }
    .kw-sub { font-size: 14px; color: var(--kimi-color-text-secondary); }
    .kw-temp-big { font-size: 72px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
    .kw-temp-unit { font-size: 24px; color: var(--kimi-color-text-secondary); font-weight: 400; }
    .kw-condition { display: flex; align-items: center; gap: 8px; font-size: 18px; color: var(--kimi-color-text-secondary); }
    .kw-hl { display: flex; gap: 16px; font-size: 14px; color: var(--kimi-color-text-tertiary); }
    .kw-hl span { display: flex; align-items: center; gap: 4px; }

    .kw-visual { display: flex; align-items: center; justify-content: center; min-height: 200px; }
    .kw-sun { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff 0%, #f59e0b 40%, #3b82f6 100%); box-shadow: 0 0 60px rgba(245, 158, 11, 0.3); animation: kw-pulse 4s ease-in-out infinite; }
    .kw-cloudy { width: 140px; height: 80px; background: var(--kimi-color-surface-strong); border-radius: 60px; position: relative; }
    .kw-cloudy::before { content: ''; position: absolute; width: 70px; height: 70px; background: var(--kimi-color-surface-raised); border-radius: 50%; top: -35px; left: 20px; }
    .kw-cloudy::after { content: ''; position: absolute; width: 50px; height: 50px; background: var(--kimi-color-surface-muted); border-radius: 50%; top: -25px; left: 60px; }
    .kw-rain { position: relative; }
    .kw-rain .kw-cloudy { background: var(--kimi-color-text-quaternary); }
    .kw-rain .kw-cloudy::before { background: var(--kimi-color-text-tertiary); }
    .kw-rain .kw-cloudy::after { background: var(--kimi-color-text-secondary); }
    .kw-rain-drops { position: absolute; bottom: -20px; left: 30px; width: 4px; height: 12px; background: var(--kimi-color-accent); border-radius: 2px; animation: kw-rain 0.8s linear infinite; box-shadow: 20px 0 0 var(--kimi-color-accent), 40px 5px 0 var(--kimi-color-accent), 60px -2px 0 var(--kimi-color-accent); }
    .kw-snow { position: relative; }
    .kw-snow .kw-cloudy { background: var(--kimi-color-surface-strong); }
    .kw-snow .kw-cloudy::before { background: var(--kimi-color-surface-raised); }
    .kw-snow .kw-cloudy::after { background: var(--kimi-color-surface-muted); }
    .kw-snow-flakes { position: absolute; bottom: -15px; left: 25px; width: 6px; height: 6px; background: var(--kimi-color-text-primary); border-radius: 50%; animation: kw-snow 2s linear infinite; box-shadow: 25px 5px 0 var(--kimi-color-text-primary), 50px -3px 0 var(--kimi-color-text-primary), 70px 8px 0 var(--kimi-color-text-primary); }
    .kw-storm { position: relative; }
    .kw-storm .kw-cloudy { background: var(--kimi-color-text-secondary); }
    .kw-storm .kw-cloudy::before { background: var(--kimi-color-text-primary); }
    .kw-storm .kw-cloudy::after { background: var(--kimi-color-text-tertiary); }
    .kw-bolt { position: absolute; bottom: -30px; left: 50px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 30px solid var(--kimi-color-warning); animation: kw-bolt 1.5s ease-in-out infinite; }

    @keyframes kw-pulse { 0%,100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.05); opacity: 1; } }
    @keyframes kw-rain { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(20px); opacity: 0; } }
    @keyframes kw-snow { 0% { transform: translateY(0) translateX(0); opacity: 1; } 100% { transform: translateY(25px) translateX(10px); opacity: 0; } }
    @keyframes kw-bolt { 0%,90%,100% { opacity: 0; } 92%,96% { opacity: 1; } }

    .kw-section-title { font-size: 14px; font-weight: 500; color: var(--kimi-color-text-secondary); margin-bottom: 12px; }
    .kw-hourly { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
    .kw-hourly::-webkit-scrollbar { height: 4px; }
    .kw-hourly::-webkit-scrollbar-thumb { background: var(--kimi-color-border); border-radius: 2px; }
    .kw-hour { flex: 0 0 64px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 8px; border-radius: 10px; border: 1px solid var(--kimi-color-border); background: var(--kimi-color-surface); transition: background var(--t-fast) var(--ease-out); }
    .kw-hour:hover { background: var(--kimi-color-surface-raised); }
    .kw-hour-time { font-size: 12px; color: var(--kimi-color-text-tertiary); }
    .kw-hour-temp { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .kw-hour-icon { width: 24px; height: 24px; }

    .kw-daily { display: flex; flex-direction: column; gap: 8px; }
    .kw-day-row { display: grid; grid-template-columns: 80px 1fr 60px 60px; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--kimi-color-border); background: var(--kimi-color-surface); transition: background var(--t-fast) var(--ease-out); }
    .kw-day-row:hover { background: var(--kimi-color-surface-raised); }
    .kw-day-name { font-size: 14px; font-weight: 500; }
    .kw-day-bar { height: 6px; border-radius: 3px; background: var(--kimi-color-surface-muted); position: relative; overflow: hidden; }
    .kw-day-bar-fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 3px; background: var(--kimi-color-accent); }
    .kw-day-lo { font-size: 14px; color: var(--kimi-color-text-tertiary); text-align: right; font-variant-numeric: tabular-nums; }
    .kw-day-hi { font-size: 14px; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }

    .kw-details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 600px) { .kw-details { grid-template-columns: repeat(2, 1fr); } }
    .kw-detail { padding: 16px; border-radius: 10px; border: 1px solid var(--kimi-color-border); background: var(--kimi-color-surface); display: flex; flex-direction: column; gap: 6px; }
    .kw-detail-label { font-size: 12px; color: var(--kimi-color-text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; }
    .kw-detail-value { font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }

    .kw-chart-wrap { padding: 16px; border-radius: 10px; border: 1px solid var(--kimi-color-border); background: var(--kimi-color-surface); }
    .kw-chart-svg { width: 100%; height: 160px; }

    .kw-cities { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .kw-chip { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--kimi-color-border); background: var(--kimi-color-surface); font-size: 13px; cursor: pointer; transition: all var(--t-fast) var(--ease-out); color: var(--kimi-color-text-secondary); }
    .kw-chip:hover { background: var(--kimi-color-surface-raised); color: var(--kimi-color-text-primary); border-color: var(--kimi-color-text-tertiary); }
    .kw-chip.active { background: var(--kimi-color-text-primary); color: var(--kimi-color-surface); border-color: var(--kimi-color-text-primary); }

    .kw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px; }
    @media (max-width: 720px) { .kw-grid { grid-template-columns: 1fr; } }

    .kw-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .kw-brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 500; }
    .kw-brand-icon { width: 28px; height: 28px; border-radius: 6px; background: var(--kimi-color-text-primary); display: flex; align-items: center; justify-content: center; }
    .kw-brand-icon svg { width: 18px; height: 18px; color: var(--kimi-color-surface); }
    .kw-unit-badge { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--kimi-color-border); font-size: 12px; font-weight: 500; color: var(--kimi-color-text-secondary); background: var(--kimi-color-surface); }

    .kw-suggestions { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: var(--kimi-color-surface-raised); border: 1px solid var(--kimi-color-border); border-radius: 10px; overflow: hidden; z-index: 10; display: none; }
    .kw-suggestions.show { display: block; }
    .kw-suggestion { padding: 10px 14px; cursor: pointer; font-size: 14px; transition: background var(--t-fast) var(--ease-out); }
    .kw-suggestion:hover { background: var(--kimi-color-surface-strong); }
    .kw-suggestion:not(:last-child) { border-bottom: 1px solid var(--kimi-color-border); }
    .kw-search-wrap { position: relative; }

    .kw-now { font-size: 13px; color: var(--kimi-color-text-quaternary); margin-top: 4px; }

    .footer { text-align: center; padding: 40px 0 20px; font-size: 12px; color: var(--kimi-color-text-quaternary); }
  </style>

      'Berlin': { country: 'Germany', temp: 286.4, condition: 'Light rain', hi: 288.9, lo: 283.7, humidity: 76, wind: 17, pressure: 1012, visibility: 8, uv: 2, dewpoint: 282.3, type: 'rain' },
      'Toronto': { country: 'Canada', temp: 280.5, condition: 'Snow showers', hi: 283.1, lo: 277.8, humidity: 82, wind: 24, pressure: 1022, visibility: 5, uv: 1, dewpoint: 277.2, type: 'snow' },
      'Bangkok': { country: 'Thailand', temp: 306.1, condition: 'Monsoon rain', hi: 308.9, lo: 303.4, humidity: 86, wind: 13, pressure: 1007, visibility: 6, uv: 5, dewpoint: 303.7, type: 'rain' },
      'Los Angeles': { country: 'United States', temp: 299.3, condition: 'Sunny', hi: 302.1, lo: 294.5, humidity: 48, wind: 9, pressure: 1016, visibility: 18, uv: 8, dewpoint: 287.2, type: 'sunny' },
      'Seoul': { country: 'South Korea', temp: 289.6, condition: 'Cloudy', hi: 292.3, lo: 286.8, humidity: 60, wind: 15, pressure: 1014, visibility: 10, uv: 4, dewpoint: 281.5, type: 'cloudy' },
      'Mexico City': { country: 'Mexico', temp: 293.8, condition: 'Partly cloudy', hi: 296.5, lo: 290.2, humidity: 52, wind: 11, pressure: 1019, visibility: 13, uv: 6, dewpoint: 283.1, type: 'cloudy' },
      'Nairobi': { country: 'Kenya', temp: 294.5, condition: 'Sunny', hi: 297.2, lo: 290.8, humidity: 45, wind: 14, pressure: 1017, visibility: 15, uv: 9, dewpoint: 281.4, type: 'sunny' },
      'Helsinki': { country: 'Finland', temp: 278.3, condition: 'Overcast', hi: 280.7, lo: 275.9, humidity: 70, wind: 21, pressure: 1024, visibility: 9, uv: 1, dewpoint: 273.2, type: 'cloudy' }
    };

    let currentCity = 'London';

    function generateHourly(baseTemp) {
      const hours = [];
      const now = new Date().getHours();
      for (let i = 0; i < 24; i++) {
        const h = (now + i) % 24;
        const offset = Math.sin((h - 6) * Math.PI / 12) * 4;
        const rand = (Math.random() - 0.5) * 1.5;
        hours.push({ hour: h, temp: +(baseTemp + offset + rand).toFixed(1) });
      }
      return hours;
    }

    function generateDaily(baseTemp) {
      const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      const today = new Date().getDay();
      const result = [];
      for (let i = 0; i < 7; i++) {
        const d = (today + i) % 7;
        const offset = (Math.random() - 0.5) * 6;
        const hi = +(baseTemp + 3 + offset).toFixed(1);
        const lo = +(baseTemp - 3 + offset * 0.5).toFixed(1);
        result.push({ day: days[d], hi, lo });
      }
      return result;
    }

    function getVisual(type) {
      if (type === 'sunny' || type === 'clear') return '<div class="kw-sun"></div>';
      if (type === 'cloudy') return '<div class="kw-cloudy"></div>';
      if (type === 'rain') return '<div class="kw-rain"><div class="kw-cloudy"></div><div class="kw-rain-drops"></div></div>';
      if (type === 'snow') return '<div class="kw-snow"><div class="kw-cloudy"></div><div class="kw-snow-flakes"></div></div>';
      if (type === 'storm') return '<div class="kw-storm"><div class="kw-cloudy"></div><div class="kw-bolt"></div></div>';
      return '<div class="kw-sun"></div>';
    }

    function getConditionIcon(type) {
      if (type === 'sunny' || type === 'clear') return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" fill="currentColor"/><path d="M12 2V4M12 20V22M4 12H2M22 12H20M5.6 5.6L4.2 4.2M19.8 19.8L18.4 18.4M5.6 18.4L4.2 19.8M19.8 4.2L18.4 5.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
      if (type === 'cloudy') return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 18C3.79086 18 2 16.2091 2 14C2 11.7909 3.79086 10 6 10C6.34207 10 6.67217 10.0447 6.98556 10.1293C7.61869 7.20219 10.2022 5 13.5 5C17.0899 5 20 7.91015 20 11.5C20 11.7236 19.9904 11.9447 19.9716 12.1625C21.7543 12.5513 23 14.1392 23 16C23 18.2091 21.2091 20 19 20H6Z" fill="currentColor"/></svg>';
      if (type === 'rain') return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 16C3.79086 16 2 14.2091 2 12C2 9.79086 3.79086 8 6 8C6.34207 8 6.67217 8.04467 6.98556 8.12929C7.61869 5.20219 10.2022 3 13.5 3C17.0899 3 20 5.91015 20 9.5C20 9.72355 19.9904 9.94473 19.9716 10.1625C21.7543 10.5513 23 12.1392 23 14C23 16.2091 21.2091 18 19 18H6Z" fill="currentColor"/><path d="M8 20L7 22M12 20L11 22M16 20L15 22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
      if (type === 'snow') return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 16C3.79086 16 2 14.2091 2 12C2 9.79086 3.79086 8 6 8C6.34207 8 6.67217 8.04467 6.98556 8.12929C7.61869 5.20219 10.2022 3 13.5 3C17.0899 3 20 5.91015 20 9.5C20 9.72355 19.9904 9.94473 19.9716 10.1625C21.7543 10.5513 23 12.1392 23 14C23 16.2091 21.2091 18 19 18H6Z" fill="currentColor"/><circle cx="8" cy="21" r="1" fill="currentColor"/><circle cx="12" cy="21" r="1" fill="currentColor"/><circle cx="16" cy="21" r="1" fill="currentColor"/></svg>';
      if (type === 'storm') return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 16C3.79086 16 2 14.2091 2 12C2 9.79086 3.79086 8 6 8C6.34207 8 6.67217 8.04467 6.98556 8.12929C7.61869 5.20219 10.2022 3 13.5 3C17.0899 3 20 5.91015 20 9.5C20 9.72355 19.9904 9.94473 19.9716 10.1625C21.7543 10.5513 23 12.1392 23 14C23 16.2091 21.2091 18 19 18H6Z" fill="currentColor"/><path d="M13 20L11 23H14L12 26" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" fill="currentColor"/></svg>';
    }

    function renderChart(hourly) {
      const svg = document.getElementById('kw-chart');
      const temps = hourly.map(h => h.temp);
      const min = Math.min(...temps) - 1;
      const max = Math.max(...temps) + 1;
      const range = max - min;
      const w = 600, h = 160, pad = 20;
      const cw = w - pad * 2, ch = h - pad * 2;

      let path = '';
      let area = '';
      const pts = [];
      for (let i = 0; i < temps.length; i++) {
        const x = pad + (i / (temps.length - 1)) * cw;
        const y = pad + ch - ((temps[i] - min) / range) * ch;
        pts.push({x, y, temp: temps[i]});
        if (i === 0) { path += `M ${x} ${y}`; area += `M ${x} ${h}`; }
        else { path += ` L ${x} ${y}`; }
      }
      area = `M ${pad} ${h} ` + pts.map(p => `L ${p.x} ${p.y}`).join(' ') + ` L ${w - pad} ${h} Z`;

      let dots = '';
      for (const p of pts) {
        dots += `<circle cx="${p.x}" cy="${p.y}" r="3" fill="#3b82f6"/>`;
        if (p.x % 80 < 10) {
          dots += `<text x="${p.x}" y="${p.y - 10}" text-anchor="middle" font-size="11" fill="#a0a0a8" font-family="var(--kimi-font-sans)">${p.temp.toFixed(1)}</text>`;
        }
      }

      svg.innerHTML = `
        <defs>
          <linearGradient id="kwgrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="${area}" fill="url(#kwgrad)"/>
        <path d="${path}" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        ${dots}
      `;
    }

    function render() {
      const data = cities[currentCity];
      document.getElementById('kw-city').textContent = currentCity;
      document.getElementById('kw-country').textContent = data.country;
      document.getElementById('kw-temp').textContent = data.temp.toFixed(1);
      document.getElementById('kw-condition').innerHTML = getConditionIcon(data.type) + '<span>' + data.condition + '</span>';
      document.getElementById('kw-hi').textContent = data.hi.toFixed(1) + ' K';
      document.getElementById('kw-lo').textContent = data.lo.toFixed(1) + ' K';
      document.getElementById('kw-visual').innerHTML = getVisual(data.type);

      const now = new Date();
      const opts = { weekday: 'long', hour: '2-digit', minute: '2-digit' };
      document.getElementById('kw-now').textContent = now.toLocaleDateString('en-US', opts);

      const hourly = generateHourly(data.temp);
      const hourlyEl = document.getElementById('kw-hourly');
      hourlyEl.innerHTML = hourly.map(h => `
        <div class="kw-hour">
          <div class="kw-hour-time">${h.hour}:00</div>
          <div class="kw-hour-icon">${getConditionIcon(Math.random() > 0.5 ? data.type : 'cloudy')}</div>
          <div class="kw-hour-temp">${h.temp.toFixed(1)}</div>
        </div>
      `).join('');

      const daily = generateDaily(data.temp);
      const allTemps = daily.flatMap(d => [d.hi, d.lo]);
      const dMin = Math.min(...allTemps), dMax = Math.max(...allTemps);
      const dRange = dMax - dMin || 1;
      const dailyEl = document.getElementById('kw-daily');
      dailyEl.innerHTML = daily.map(d => {
        const left = ((d.lo - dMin) / dRange) * 100;
        const width = ((d.hi - d.lo) / dRange) * 100;
        return `
          <div class="kw-day-row">
            <div class="kw-day-name">${d.day}</div>
            <div class="kw-day-bar"><div class="kw-day-bar-fill" style="left:${left}%; width:${width}%"></div></div>
            <div class="kw-day-lo">${d.lo.toFixed(1)}</div>
            <div class="kw-day-hi">${d.hi.toFixed(1)}</div>
          </div>
        `;
      }).join('');

      renderChart(hourly);

      const details = [
        { label: 'Humidity', value: data.humidity + '%' },
        { label: 'Wind', value: data.wind + ' km/h' },
        { label: 'Pressure', value: data.pressure + ' hPa' },
        { label: 'Visibility', value: data.visibility + ' km' },
        { label: 'UV index', value: data.uv },
        { label: 'Dew point', value: data.dewpoint.toFixed(1) + ' K' }
      ];
      document.getElementById('kw-details').innerHTML = details.map(d => `
        <div class="kw-detail">
          <div class="kw-detail-label">${d.label}</div>
          <div class="kw-detail-value">${d.value}</div>
        </div>
      `).join('');

      const cityNames = Object.keys(cities);
      document.getElementById('kw-cities').innerHTML = cityNames.map(c => `
        <div class="kw-chip ${c === currentCity ? 'active' : ''}" data-city="${c}">${c}</div>
      `).join('');

      document.querySelectorAll('.kw-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          currentCity = chip.dataset.city;
          render();
        });
      });
    }

    const searchInput = document.getElementById('kw-search');
    const suggestions = document.getElementById('kw-suggestions');

    searchInput.addEventListener('input', () => {
      const val = searchInput.value.trim().toLowerCase();
      if (!val) { suggestions.classList.remove('show'); return; }
      const matches = Object.keys(cities).filter(c => c.toLowerCase().includes(val));
      if (matches.length) {
        suggestions.innerHTML = matches.map(c => `<div class="kw-suggestion" data-city="${c}">${c}</div>`).join('');
        suggestions.classList.add('show');
        suggestions.querySelectorAll('.kw-suggestion').forEach(s => {
          s.addEventListener('click', () => {
            currentCity = s.dataset.city;
            searchInput.value = '';
            suggestions.classList.remove('show');
            render();
          });
        });
      } else {
        suggestions.classList.remove('show');
      }
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = searchInput.value.trim().toLowerCase();
        const match = Object.keys(cities).find(c => c.toLowerCase().includes(val));
        if (match) {
          currentCity = match;
          searchInput.value = '';
          suggestions.classList.remove('show');
          render();
        }
      }
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.kw-search-wrap')) suggestions.classList.remove('show');
    });

    document.getElementById('kw-refresh').addEventListener('click', () => {
      const btn = document.getElementById('kw-refresh');
      btn.style.transform = 'rotate(360deg)';
      btn.style.transition = 'transform 0.6s ease';
      setTimeout(() => { btn.style.transform = 'rotate(0deg)'; render(); }, 600);
    });

    render();
  })();
  </script>
